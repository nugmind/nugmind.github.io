<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nugmind Studio - Indie Games & Apps</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .logo-wrap {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1E3A8A, #0F172A);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .logo-wrap svg {
            width: 100%;
            height: 100%;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94A3B8;
            font-size: 1rem;
            margin-bottom: 28px;
        }
        .game-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #A5B4FC;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .btn-playstore {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563EB, #4F46E5);
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
        }
        .btn-playstore:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.6);
        }
        .links {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .links a {
            color: #64748B;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .links a:hover {
            color: #38BDF8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-wrap">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#0F172A"/>
                <!-- Tile L -->
                <rect x="14" y="14" width="32" height="32" rx="8" fill="#3B82F6"/>
                <text x="30" y="36" fill="white" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">L</text>
                <!-- Tile E -->
                <rect x="54" y="14" width="32" height="32" rx="8" fill="#F59E0B"/>
                <text x="70" y="36" fill="white" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">E</text>
                <!-- Tile X -->
                <rect x="14" y="54" width="32" height="32" rx="8" fill="#EC4899"/>
                <text x="30" y="76" fill="white" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">X</text>
                <!-- Tile I -->
                <rect x="54" y="54" width="32" height="32" rx="8" fill="#10B981"/>
                <text x="70" y="76" fill="white" font-size="20" font-weight="bold" font-family="sans-serif" text-anchor="middle">I</text>
                <!-- Magnifier Glass -->
                <circle cx="50" cy="50" r="24" stroke="#FDE047" stroke-width="6" fill="none"/>
                <line x1="68" y1="68" x2="88" y2="88" stroke="#FDE047" stroke-width="8" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>Nugmind Studio</h1>
        <p class="subtitle">Crafting engaging, fun, and brain-teasing puzzle games.</p>

        <span class="game-badge">Featured Game: Lexi Hunt</span>
        <br>
        <a class="btn-playstore" href="https://play.google.com/store/apps/details?id=com.mrnugi.lexihunt" target="_blank">
            🎮 Get Lexi Hunt on Google Play
        </a>

        <div class="links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="app-ads.txt">app-ads.txt</a>
            <a href="mailto:nugmind.studio@gmail.com">Contact Us</a>
        </div>
    </div>
</body>
</html>
